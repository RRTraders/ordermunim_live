<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 290px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p.desc {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 14px 0;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .status-card {
      margin-top: 14px;
      padding: 10px;
      background: #1e293b;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 11px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #94a3b8;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .val {
      font-weight: 600;
      color: #f1f5f9;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-green {
      background: #065f46;
      color: #34d399;
    }
    .badge-yellow {
      background: #78350f;
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <h2>📦 Meesho OTP Sync</h2>
  <p class="desc">Connects this browser tab to your Mobile App.</p>

  <label for="syncKey">Account Sync Key</label>
  <input type="text" id="syncKey" placeholder="e.g. MSH-9482" />
  
  <button id="saveBtn">Save & Activate</button>

  <div class="status-card">
    <div class="status-row">
      <span>Status:</span>
      <span id="syncStatus" class="badge badge-yellow">Not Connected</span>
    </div>
    <div class="status-row">
      <span>Last Synced OTP:</span>
      <span id="lastOtp" class="val">--</span>
    </div>
    <div class="status-row">
      <span>Courier:</span>
      <span id="lastCourier" class="val">--</span>
    </div>
    <div class="status-row">
      <span>Handover Count:</span>
      <span id="lastCount" class="val">--</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
