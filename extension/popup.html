<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OrdersMunim Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      background: #090d16;
      color: #f8fafc;
    }
    .header {
      padding: 16px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #FF3F6C, #F16521);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 63, 108, 0.3);
    }
    .header-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }
    .header-text p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: #94a3b8;
    }
    .content {
      padding: 14px 16px 16px 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-active {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-expired {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .feature-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #334155/50;
    }
    .feature-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .feature-name {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .feature-status {
      font-size: 11px;
      font-weight: 700;
    }
    .text-emerald { color: #34d399; }
    .text-rose { color: #f87171; }
    .text-muted { color: #64748b; }
    
    label {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #FF3F6C, #F16521);
      color: white;
    }
    .btn-primary:hover {
      opacity: 0.92;
    }
    .btn-renew {
      background: #ef4444;
      color: white;
      margin-top: 8px;
      text-decoration: none;
      text-align: center;
    }
    .btn-renew:hover {
      background: #dc2626;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
    }
    .error-msg {
      font-size: 11px;
      color: #f87171;
      margin-top: 4px;
      display: none;
    }
    .success-msg {
      font-size: 11px;
      color: #34d399;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">M</div>
    <div class="header-text">
      <h1>OrdersMunim</h1>
      <p>Myntra QZ Bypass &amp; Meesho Sync</p>
    </div>
  </div>

  <div class="content">
    <!-- Subscription Status Card -->
    <div class="card" id="subscriptionCard">
      <div class="card-title">
        <span>License &amp; Plan</span>
        <span id="subBadge" class="badge badge-expired">CHECKING...</span>
      </div>
      <div id="subDetails" style="font-size: 11px; color: #cbd5e1; line-height: 1.4;">
        Loading license status...
      </div>
      <a href="https://ordermunim.web.app" target="_blank" id="renewBtn" class="btn btn-renew" style="display: none;">
        Renew Subscription on Web
      </a>
    </div>

    <!-- Features Card -->
    <div class="card">
      <div class="card-title">Active Integrations</div>
      <div class="feature-row">
        <div class="feature-name">
          <span>📦</span>
          <span>Myntra Virtual QZ</span>
        </div>
        <span id="myntraStatus" class="feature-status text-muted">Checking...</span>
      </div>
      <div class="feature-row">
        <div class="feature-name">
          <span>🔄</span>
          <span>Meesho Return OTP</span>
        </div>
        <span id="meeshoStatus" class="feature-status text-muted">Checking...</span>
      </div>
    </div>

    <!-- Login / Key Setup Card -->
    <div class="card" id="authCard">
      <div class="card-title">Account Settings</div>
      
      <div id="loggedOutSection">
        <label>OrdersMunim Email</label>
        <input type="email" id="emailInput" placeholder="seller@gmail.com" />
        
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" />
        
        <button type="button" id="loginBtn" class="btn btn-primary">Sign In to Activate</button>
      </div>

      <div id="loggedInSection" style="display: none;">
        <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 8px;">
          Signed in as: <strong id="userEmailDisplay" style="color: #fff;">--</strong>
        </div>

        <label>Meesho Account Key (Optional)</label>
        <input type="text" id="syncKeyInput" placeholder="e.g. ACC_91823" />
        <button type="button" id="saveKeyBtn" class="btn btn-primary" style="margin-bottom: 6px;">Update Sync Key</button>

        <button type="button" id="logoutBtn" class="btn btn-secondary">Sign Out</button>
      </div>

      <div id="authError" class="error-msg"></div>
      <div id="authSuccess" class="success-msg"></div>
    </div>

    <div class="footer">
      OrdersMunim v2.0 • Secured &amp; License Protected
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
