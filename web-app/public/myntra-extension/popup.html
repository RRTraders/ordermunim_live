<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OrdersMunim Myntra Downloader</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF3F6C, #F16521);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      font-size: 16px;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
    }
    .subtitle {
      font-size: 10px;
      color: #94a3b8;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .box {
      background: #1e293b;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .box span {
      color: #38bdf8;
      font-weight: 600;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px 0;
      text-align: center;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">M</div>
    <div>
      <div class="title">OrdersMunim</div>
      <div class="subtitle">Myntra Label Downloader</div>
    </div>
  </div>

  <div class="badge">
    <span class="dot"></span> Virtual QZ Tray: Active
  </div>

  <div class="box">
    <div>Printer Name:</div>
    <span>OrdersMunim Thermal Label Printer</span>
    <div style="margin-top: 6px;">QZ Tray & Physical Printer:</div>
    <span style="color: #10b981;">Bypassed (Auto-Download PDF)</span>
  </div>

  <a href="https://partners.myntrainfo.com/" target="_blank" class="btn">
    Open Myntra Partner Portal
  </a>
</body>
</html>
