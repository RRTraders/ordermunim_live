<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#083B82" />
    <title>OrderMunim - Smart Order &amp; OTP Hub</title>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased selection:bg-orange-500 selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height:100vh;background-color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <header style="background:rgba(255,255,255,0.9);border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:40;height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <div style="width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#083B82,#F97316);"></div>
            <div style="font-size:1.15rem;font-weight:900;letter-spacing:-0.02em;color:#0F172A;">Order<span style="color:#EA580C;">Munim</span></div>
          </div>
          <div style="width:34px;height:34px;border-radius:50%;background:#F1F5F9;"></div>
        </header>
        <main style="max-width:1280px;margin:1.5rem auto;padding:0 1rem;">
          <div style="height:110px;border-radius:1.5rem;background:linear-gradient(135deg,#083B82,#0A4EA3);margin-bottom:1.5rem;"></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">
            <div style="height:140px;border-radius:1rem;background:#FFFFFF;border:1px solid #E2E8F0;"></div>
            <div style="height:140px;border-radius:1rem;background:#FFFFFF;border:1px solid #E2E8F0;"></div>
            <div style="height:140px;border-radius:1rem;background:#FFFFFF;border:1px solid #E2E8F0;"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
